<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Try Codex Kanban with fake data. Organize parallel Codex tasks without adding another place to work." />
    <meta name="color-scheme" content="light" />
    <title>Codex Kanban — Demo</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell" id="appShell">
      <header class="app-bar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">K</div>
          <div>
            <h1>Codex Kanban</h1>
            <p id="boardSummary">Fake tasks · drag to organize</p>
          </div>
        </div>
        <div class="app-actions">
          <button class="hidden-toggle" id="hiddenToggleButton" type="button" aria-pressed="false">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="17" height="17">
              <path d="M2.5 12s3.5-5.5 9.5-5.5 9.5 5.5 9.5 5.5-3.5 5.5-9.5 5.5S2.5 12 2.5 12Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
              <circle cx="12" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="1.7" />
              <path d="m4 4 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
            </svg>
            <span class="hidden-toggle-label" id="hiddenToggleLabel">Show hidden</span>
            <span class="hidden-count" id="hiddenCount">1</span>
          </button>
          <div class="connection" data-state="ready">
            <span class="connection-dot" aria-hidden="true"></span>
            <span>Demo data</span>
          </div>
          <details class="about-menu">
            <summary>About</summary>
            <div class="about-popover">
              <p>This public demo is static and fake. The real app reads your tasks only on your computer.</p>
              <a href="https://github.com/luke-toledo/codex-kanban" target="_blank" rel="noopener noreferrer">
                <span>Get Codex Kanban</span>
                <span aria-hidden="true">↗</span>
              </a>
              <a href="https://x.com/lukesvg" target="_blank" rel="noopener noreferrer">
                <span>Made by Luke</span>
                <span aria-hidden="true">↗</span>
              </a>
            </div>
          </details>
          <button class="icon-button" id="resetButton" type="button" aria-label="Reset demo" title="Reset demo">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18">
              <path d="M20 11a8 8 0 1 0-2.35 5.65M20 5v6h-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
      </header>

      <main class="board" id="board" aria-label="Codex task board demo">
        <section class="column" data-column="backlog">
          <header class="column-header"><div><span class="column-dot" aria-hidden="true"></span><h2>Backlog</h2></div><span class="column-count" data-count="backlog">0</span></header>
          <div class="column-list" data-list="backlog"></div>
        </section>
        <section class="column" data-column="todo">
          <header class="column-header"><div><span class="column-dot" aria-hidden="true"></span><h2>To Do</h2></div><span class="column-count" data-count="todo">0</span></header>
          <div class="column-list" data-list="todo"></div>
        </section>
        <section class="column" data-column="in-progress">
          <header class="column-header"><div><span class="column-dot" aria-hidden="true"></span><h2>In Progress</h2></div><span class="column-count" data-count="in-progress">0</span></header>
          <div class="column-list" data-list="in-progress"></div>
        </section>
        <section class="column" data-column="review">
          <header class="column-header"><div><span class="column-dot" aria-hidden="true"></span><h2>Review</h2></div><span class="column-count" data-count="review">0</span></header>
          <div class="column-list" data-list="review"></div>
        </section>
        <section class="column" data-column="done">
          <header class="column-header"><div><span class="column-dot" aria-hidden="true"></span><h2>Done</h2></div><span class="column-count" data-count="done">0</span></header>
          <div class="column-list" data-list="done"></div>
        </section>
      </main>
    </div>

    <div class="chat-layer" id="chatLayer" aria-hidden="true">
      <button class="chat-backdrop" id="chatBackdrop" type="button" tabindex="-1" aria-label="Close conversation"></button>
      <section class="chat-panel" role="dialog" aria-modal="true" aria-labelledby="chatTitle">
        <header class="chat-header">
          <div class="chat-identity"><h2 id="chatTitle">Conversation</h2><p id="chatFolder"></p></div>
          <div class="chat-status unknown" id="chatStatus">Unknown</div>
          <button class="icon-button chat-close-button" id="closeChatButton" type="button" aria-label="Close conversation" title="Close">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="21" height="21"><path d="m7 7 10 10M17 7 7 17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" /></svg>
          </button>
        </header>
        <div class="message-scroll" id="messageScroll"><div class="message-list" id="messageList"></div></div>
        <footer class="chat-footer">
          <button class="edit-in-codex demo-edit-button" id="demoCodexButton" type="button">
            <span>To edit, go to Codex</span><span aria-hidden="true">↗</span>
          </button>
        </footer>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/demo.js"></script>
  </body>
</html>
